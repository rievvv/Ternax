<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f2a">
<title>Ternax by Nexora</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ternax">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SPLASH (hanya tampil di smartphone) -->
<div id="splash">
  <svg class="leaf" viewBox="0 0 100 100" width="110" height="110" aria-hidden="true">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#c8f5a0"/>
      </linearGradient>
    </defs>
    <path d="M50 8C22 20 12 48 22 72c6 12 18 20 28 20s22-8 28-20C88 48 78 20 50 8z" fill="url(#lg)"/>
    <path d="M50 24v62M50 46c-9-3-15-9-19-17M50 46c9-3 15-9 19-17M50 64c-8-2-13-7-16-13M50 64c8-2 13-7 16-13" stroke="#0b4f2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="s-title">TERNAX</div>
  <div class="s-sub">by Nexora</div>
</div>

<!-- LOGIN -->
<div id="login" class="hidden"><div class="lbox">
  <svg viewBox="0 0 100 100" width="64" height="64"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be15d"/><stop offset="1" stop-color="#0b4f2a"/></linearGradient></defs><path d="M50 8C22 20 12 48 22 72c6 12 18 20 28 20s22-8 28-20C88 48 78 20 50 8z" fill="url(#lg2)"/><path d="M50 24v62M50 46c-9-3-15-9-19-17M50 46c9-3 15-9 19-17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
  <h1>TERNAX</h1><small>by Nexora</small>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password (min. 6 karakter)" autocomplete="current-password">
  <div id="lerr"></div>
  <button class="btn" id="lin">Masuk</button>
  <button class="btn alt" id="lreg">Daftar akun baru</button>
  <button class="btn alt hidden" id="inst2">⬇ Pasang aplikasi / buat pintasan</button>
  <div class="hint hidden" id="ios">iPhone: buka di Safari, ketuk tombol Share, lalu pilih <b>Add to Home Screen</b>.</div>
</div></div>

<div id="app" class="hidden">
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 100 100" width="34" height="34" aria-hidden="true">
      <path d="M50 8C22 20 12 48 22 72c6 12 18 20 28 20s22-8 28-20C88 48 78 20 50 8z" fill="#fff"/>
      <path d="M50 24v62M50 46c-9-3-15-9-19-17M50 46c9-3 15-9 19-17" stroke="#0b4f2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <div><h1>Ternax</h1><small>by Nexora</small></div>
  </div>
  <!-- Menu: tombol di atas (laptop/PC), bar bawah (smartphone) -->
  <nav id="nav"></nav>
  <div class="hr"><span id="sync">●</span><span id="who"></span><button class="btn hidden" id="inst">⬇ Pasang</button><button class="btn" id="out">Keluar</button></div>
</header>

<main id="main"></main>

<div class="modal" id="modal"><div class="box" id="box"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
